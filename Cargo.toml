[package]
name = "omni-exporter"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Douglas Su <doug.su.au@gmail.com>"]
repository = "https://github.com/d0u9/omni-exporter"
homepage = "https://github.com/d0u9/omni-exporter"
readme = "README.md"
description = """
An exporter built for resource-constrained systems.
"""

[dependencies]
log = { version = "0.4" }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
uuid = { version = "1.15.1", features = ["v4"] }
sysinfo = { version =  "0.33.1" }
async-trait = "0.1"
rand = "0.9.0"

[dev-dependencies]
env_logger = "0.11"
